<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b91c1c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Geometric Decorative Circle -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 6"/>

  <!-- Capacity 'C' Dynamic Ribbon Arch -->
  <path d="M 88 40 C 72 26, 44 30, 36 50 C 26 72, 38 98, 64 98 C 76 98, 86 92, 92 84" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Compass Star in Center -->
  <polygon points="64,48 68,60 80,64 68,68 64,80 60,68 48,64 60,60" fill="#ffffff" opacity="0.95"/>
</svg>
