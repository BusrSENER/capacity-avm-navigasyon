      </text>
    </g>
    <g class="store-polygon" data-id="store_1_3" id="room_1_3" data-name="Body Therapy Pilates Stüdyo">
      <rect x="715.2" y="140.0" width="80.0" height="170.0" rx="6"
            fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="755.2" y="229.0"
            fill="#1e293b" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        Body Therapy Pilates Stüdyo
      </text>
    </g>
    <g class="store-polygon" data-id="store_1_4" id="room_1_4" data-name="Dry Clean Express">
      <rect x="962.9" y="140.0" width="80.0" height="170.0" rx="6"
            fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="1002.9" y="229.0"
            fill="#1e293b" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        Dry Clean Express
      </text>
    </g>
    <g class="store-polygon" data-id="store_1_5" id="room_1_5" data-name="Nail Up">
      <rect x="456.8" y="560.0" width="80.0" height="170.0" rx="6"
            fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="496.8" y="649.0"
            fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        Nail Up
      </text>
    </g>
    <g class="store-polygon" data-id="store_1_6" id="room_1_6" data-name="PetBox">
      <rect x="735.4" y="560.0" width="80.0" height="170.0" rx="6"
            fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="775.4" y="649.0"
            fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        PetBox
      </text>
    </g>
    <g class="store-polygon" data-id="store_1_7" id="room_1_7" data-name="Simurg Sanat Evi">
      <rect x="100.0" y="200.0" width="110.0" height="140.0" rx="6"
            fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="155.0" y="274.0"
            fill="#1e293b" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        Simurg Sanat Evi
      </text>
    </g>
    <g class="store-polygon" data-id="store_1_8" id="room_1_8" data-name="Vodafone">
      <rect x="1090.0" y="360.0" width="120.0" height="140.0" rx="6"
            fill="#e0e7ff" stroke="#818cf8" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="1150.0" y="434.0"
            fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
        Vodafone
      </text>
    </g>
  </g>
</svg>