  <!-- Saf Beyaz Kat Gövdesi (#ffffff, stroke #cbd5e1) -->
  <path d="M 90,130 
           L 660,130 
           L 660,50 L 740,50 L 740,130 
           L 1090,130 
           C 1170,130 1280,220 1280,440 
