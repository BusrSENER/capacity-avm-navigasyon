  <!-- 4. FIXED VERTICAL ICONS (Escalators, Elevators, Stairs) -->
  <g id="FloorIcons" class="pointer-events-none">
    <!-- South Panoramic Elevators -->
    <g transform="translate(258, 575)" class="portal-svg portal-elevator" opacity="0.95">
      <rect x="-14" y="-12" width="28" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M-6 -4 L0 -10 L6 -4 M-6 4 L0 10 L6 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- South Escalators -->
    <g transform="translate(230, 565)" class="portal-svg portal-escalator" opacity="0.95">
      <rect x="-12" y="-10" width="24" height="20" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
      <path d="M-7 4 L-2 4 L3 -4 L7 -4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- North Escalators -->
    <g transform="translate(258, 165)" class="portal-svg portal-escalator" opacity="0.95">
      <rect x="-12" y="-10" width="24" height="20" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
      <path d="M-7 -4 L-2 -4 L3 4 L7 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- North Service Elevator -->
    <g transform="translate(215, 145)" class="portal-svg portal-elevator" opacity="0.9">
      <rect x="-11" y="-10" width="22" height="20" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">AS</text>
    </g>

    <!-- East Fire Stairs -->
    <g transform="translate(475, 365)" class="portal-svg portal-stairs" opacity="0.85">
      <circle r="12" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">MD</text>
    </g>

    <!-- West Fire Stairs -->
    <g transform="translate(40, 365)" class="portal-svg portal-stairs" opacity="0.85">
      <circle r="12" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">MD</text>
