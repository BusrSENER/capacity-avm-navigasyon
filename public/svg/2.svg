<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 735" width="100%" height="100%" class="map__svg">
  <defs>
    <filter id="slab-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="atriumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE BUILDING SLAB & CORRIDORS -->
  <g id="FloorSlab" class="map__slab">
    <!-- Outer Mall Curved Boundary -->
    <path id="slab_outer_2" class="slab corridor-path" d="M 120 45 C 200 35, 316 35, 396 45 C 475 55, 490 120, 488 200 L 488 535 C 490 620, 470 685, 396 695 C 316 705, 200 705, 120 695 C 45 685, 26 620, 28 535 L 28 200 C 26 120, 45 55, 120 45 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    
    <!-- West Corridor Lane -->
    <path class="corridor-lane" d="M 145 155 L 180 155 L 180 575 L 145 575 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- East Corridor Lane -->
    <path class="corridor-lane" d="M 336 155 L 371 155 L 371 575 L 336 575 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Center Skybridge linking corridors -->
    <rect x="175" y="348" width="166" height="34" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- 2. ATRIUM VOID / CENTRAL FOUNTAIN -->
  <g id="FloorVoids">
    <!-- Parking Columns & Central Island -->
    <rect x="195" y="240" width="126" height="250" rx="16" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6" opacity="0.85" />
    <text x="258" y="365" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="800">B2 OTOPARK (KIRMIZI / MAVİ)</text>
  </g>

  <!-- 3. STORE ROOM POLYGONS -->
  <g id="FloorRooms">
    <path id="room_2_1" class="room room--shop room--tenant g-service cat-service store-polygon" d="M 40.0 175.0 L 138.0 175.0 L 138.0 552.0 L 40.0 552.0 Z" fillRule="evenodd" data-id="store_2_1" />
  </g>

  <!-- 4. FIXED VERTICAL ICONS (Escalators, Elevators, Stairs) -->
  <g id="FloorIcons" class="pointer-events-none">
    <!-- South Panoramic Elevators -->
    <g transform="translate(258, 575)" class="portal-svg portal-elevator" opacity="0.95">
      <rect x="-14" y="-12" width="28" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M-6 -4 L0 -10 L6 -4 M-6 4 L0 10 L6 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- South Escalators -->
    <g transform="translate(230, 565)" class="portal-svg portal-escalator" opacity="0.95">
      <rect x="-12" y="-10" width="24" height="20" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
      <path d="M-7 4 L-2 4 L3 -4 L7 -4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- North Escalators -->
    <g transform="translate(258, 165)" class="portal-svg portal-escalator" opacity="0.95">
      <rect x="-12" y="-10" width="24" height="20" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
      <path d="M-7 -4 L-2 -4 L3 4 L7 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- North Service Elevator -->
    <g transform="translate(215, 145)" class="portal-svg portal-elevator" opacity="0.9">
      <rect x="-11" y="-10" width="22" height="20" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">AS</text>
    </g>

    <!-- East Fire Stairs -->
    <g transform="translate(475, 365)" class="portal-svg portal-stairs" opacity="0.85">
      <circle r="12" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">MD</text>
    </g>

    <!-- West Fire Stairs -->
    <g transform="translate(40, 365)" class="portal-svg portal-stairs" opacity="0.85">
      <circle r="12" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="900">MD</text>
    </g>
  </g>
</svg>
