<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="100%" height="100%" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: transparent;">
  <!-- ================= CAPACITY AVM GERÇEK KİOSK MİMARİ TABANI (1400 x 850) ================= -->
  <path d="M 76,120 L 760,120 C 855,120 925,190 925,280 L 925,405 L 1280,405 C 1300,405 1310,420 1310,440 L 1310,720 C 1310,738 1295,748 1275,748 L 76,748 C 58,748 52,732 52,712 L 52,145 C 52,128 62,120 76,120 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.4" />

  <!-- ================= KİOSK ANA YÜRÜME KORİDORLARI VE ARA YOLLAR ================= -->
  <g id="corridors-layer" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1">
    <!-- Kuzey Ana Koridoru (y=310, NW Merdiven x=240 -> NE Merdiven x=760) -->
    <rect x="135" y="284" width="653" height="52" rx="10" />
    <!-- Merkez Ada Koridoru (y=440, Batı x=240 -> Doğu x=760) -->
    <rect x="214" y="416" width="574" height="48" rx="8" />
    <!-- Güney Ana Koridoru & Doğu Kanadı (y=570, B Kapısı x=240 -> C Kapısı x=760 -> Paşabahçe/Anchor x=1140) -->
    <rect x="214" y="544" width="930" height="52" rx="10" />
    <!-- Batı Ana Koridoru (x=240, A Kapısı/NW Merdiven -> B Kapısı/Danışma) -->
    <rect x="214" y="284" width="52" height="410" rx="10" />
    <!-- Doğu Ana Koridoru (x=760, NE Merdiven -> Güney Merdiven -> C Kapısı) -->
    <rect x="734" y="284" width="52" height="410" rx="10" />
    <!-- Merkez Ada Dikey Ara Yolları (x=430 ve x=590) -->
    <rect x="410" y="284" width="40" height="312" rx="6" />
    <rect x="570" y="284" width="40" height="312" rx="6" />
  </g>
  <!-- Koridor Merkez Yürüme İzleri -->
