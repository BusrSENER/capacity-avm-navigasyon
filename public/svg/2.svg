<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="100%" height="100%" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: transparent;">
  <!-- ================= BİNA TABANI VE MİMARİ OMURGA (1400 x 850) ================= -->
  <path d="M 88,130 L 650,130 L 650,45 L 710,45 L 710,130 L 1110,130 C 1210,130 1285,220 1285,440 C 1285,660 1210,750 1110,750 L 88,750 C 58,750 58,130 88,130 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.2" />

  <!-- ================= ANA YATAY KORİDORLAR VE ARA YOLLAR (OPEN CORRIDORS) ================= -->
  <g id="corridors-layer" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1">
    <!-- Kuzey Ana Koridoru (y=330) -->
    <rect x="178" y="304" width="934" height="50" rx="8" />
    <!-- Merkez Ana Koridoru (y=440) -->
    <rect x="178" y="414" width="1075" height="52" rx="8" />
    <!-- Güney Ana Koridoru (y=550) -->
    <rect x="178" y="526" width="934" height="48" rx="8" />
    <!-- Dikey Ara Yollar (x=200, 370, 565, 680, 800, 1005, 1090) -->
    <rect x="178" y="135" width="44" height="605" rx="6" />
    <rect x="348" y="304" width="44" height="270" rx="6" />
    <rect x="542" y="304" width="46" height="436" rx="6" />
    <rect x="654" y="48" width="52" height="282" rx="6" />
    <rect x="778" y="304" width="44" height="270" rx="6" />
    <rect x="982" y="304" width="46" height="270" rx="6" />
    <rect x="1068" y="135" width="44" height="605" rx="6" />
  </g>
  <!-- Koridor Merkez Yürüme Çizgileri (Rehber İzleri) -->
  <g id="corridor-guides" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5" fill="none" opacity="0.75">
    <line x1="200" y1="330" x2="1090" y2="330" />
    <line x1="200" y1="440" x2="600" y2="440" />
    <line x1="800" y1="440" x2="1245" y2="440" />
    <line x1="200" y1="550" x2="1090" y2="550" />
    <line x1="200" y1="330" x2="200" y2="550" />
    <line x1="370" y1="330" x2="370" y2="550" />
    <line x1="565" y1="330" x2="565" y2="550" />
    <line x1="680" y1="55"  x2="680" y2="330" />
    <line x1="800" y1="330" x2="800" y2="550" />
    <line x1="1005" y1="330" x2="1005" y2="550" />
    <line x1="1090" y1="330" x2="1090" y2="550" />
  </g>

  <!-- Dış Cadde / Yön Bilgilendirmeleri -->
  <text x="680" y="32" fill="#0284c7" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">▲ HALİT ZİYA UŞAKLIGİL CADDESİ (CAROUSEL GEÇİŞİ)</text>
  <text x="1355" y="440" fill="#d97706" font-size="12" font-weight="800" text-anchor="middle" transform="rotate(90 1355 440)" letter-spacing="2">▲ FİŞEKHANE CADDESİ (ANA GİRİŞ / MEYDAN)</text>
  <text x="700" y="795" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">▼ DADYAN SOKAK / ACIBADEM BAKIRKÖY HASTANESİ</text>
  <text x="35" y="440" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 35 440)" letter-spacing="1">◄ ZEBERCET SOKAK / ATAKÖY YÖNÜ</text>
  <!-- Atrium Galeri Boşluğu -->
  <ellipse cx="700" cy="440" rx="85" ry="42" fill="#eef2f6" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="6 3"/>
  <text x="700" y="444" fill="#94a3b8" font-size="9.5" font-weight="700" text-anchor="middle">GALERİ BOŞLUĞU (ATRİUM)</text>
  <!-- Batı Yürüyen Merdiven Grubu -->
  <g transform="translate(245, 420)">
    <rect width="42" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="21" y="23" fill="#2563eb" font-size="12" text-anchor="middle">⚡</text>
    <text x="21" y="46" fill="#64748b" font-size="7.5" font-weight="700" text-anchor="middle">MERDİVEN</text>
  </g>
  <!-- Doğu Yürüyen Merdiven Grubu -->
  <g transform="translate(984, 420)">
    <rect width="42" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="21" y="23" fill="#2563eb" font-size="12" text-anchor="middle">⚡</text>
    <text x="21" y="46" fill="#64748b" font-size="7.5" font-weight="700" text-anchor="middle">MERDİVEN</text>
  </g>
  <!-- Panoramik Cam Asansörler -->
  <g transform="translate(551, 420)">
    <rect width="28" height="36" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="14" y="23" fill="#0284c7" font-size="12" text-anchor="middle">🛗</text>
    <text x="14" y="46" fill="#64748b" font-size="7.5" font-weight="700" text-anchor="middle">ASANSÖR</text>
  </g>

  <!-- ================= MAĞAZALAR ================= -->
  <g id="stores-layer">
    <g class="store-polygon" data-id="store_2_1" id="room_2_1" data-name="Hibatech Oto Yıkama">
      <rect x="420.0" y="140.0" width="120.0" height="162.0" rx="6" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.8" />
      <text class="pointer-events-none select-none" x="480.0" y="243.0" fill="#1e293b" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">Hibatech Oto Yıkama</text>
    </g>
  </g>
  <!-- ================= GÖMÜLÜ KURUMSAL MAĞAZA LOGOLARI ================= -->
  <g id="store-logos-svg-layer" style="pointer-events: none;">
    <g class="svg-store-brand-badge" data-store-id="store_2_1"><rect x="455.0" y="192.0" width="50.0" height="26.0" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#2dd4bf" stroke-width="0.9" /><svg x="457.0" y="193.5" width="46.0" height="23.0" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
    <rect width="100" height="100" rx="20" fill="#090d16"/>
    <path d="M28 48 C32 40, 68 40, 72 48 L76 56 C76 60, 24 60, 24 56 Z" fill="#06b6d4"/>
    <circle cx="34" cy="56" r="4" fill="#ffffff"/>
    <circle cx="66" cy="56" r="4" fill="#ffffff"/>
    <text x="50" y="74" font-family="sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">HIBATECH</text>
  </svg></g>
  </g>
</svg>