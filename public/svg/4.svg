<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 735" width="100%" height="100%" class="map__svg">
  <defs>
    <filter id="slab-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="atriumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE BUILDING SLAB & CORRIDORS -->
  <g id="FloorSlab" class="map__slab">
    <!-- Outer Mall Curved Boundary -->
    <path id="slab_outer_4" class="slab corridor-path" d="M 120 45 C 200 35, 316 35, 396 45 C 475 55, 490 120, 488 200 L 488 535 C 490 620, 470 685, 396 695 C 316 705, 200 705, 120 695 C 45 685, 26 620, 28 535 L 28 200 C 26 120, 45 55, 120 45 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    
    <!-- West Corridor Lane -->
    <path class="corridor-lane" d="M 145 155 L 180 155 L 180 575 L 145 575 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- East Corridor Lane -->
    <path class="corridor-lane" d="M 336 155 L 371 155 L 371 575 L 336 575 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Center Skybridge linking corridors -->
    <rect x="175" y="348" width="166" height="34" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- 2. ATRIUM VOID / CENTRAL FOUNTAIN -->
  <g id="FloorVoids">
    <!-- Iconic Capacity Illuminated Musical Fountain Pool -->
    <ellipse cx="258" cy="365" rx="72" ry="140" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" class="central-fountain" />
    <circle cx="258" cy="365" r="32" fill="#bae6fd" opacity="0.5" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="258" cy="365" r="8" fill="#0284c7" />
    <!-- Water Ripple Rings -->
    <circle cx="258" cy="365" r="18" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75" />
    <circle cx="258" cy="365" r="48" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />
    <text x="258" y="325" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="800" letter-spacing="0.5">MÜZİKLİ GÖSTERİ HAVUZU</text>
    <text x="258" y="415" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600">ETKİNLİK ALANI</text>
  </g>

